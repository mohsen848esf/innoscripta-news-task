services:
  news:
    build:
      context: .
      args:
        VITE_NEWSAPI_API_KEY: ${VITE_NEWSAPI_API_KEY:-}
        VITE_GUARDIAN_API_KEY: ${VITE_GUARDIAN_API_KEY:-}
        VITE_NYT_API_KEY: ${VITE_NYT_API_KEY:-}
        VITE_NEWSAPI_BASE_URL: ${VITE_NEWSAPI_BASE_URL:-https://newsapi.org/v2}
        VITE_GUARDIAN_BASE_URL: ${VITE_GUARDIAN_BASE_URL:-https://content.guardianapis.com}
        VITE_NYT_BASE_URL: ${VITE_NYT_BASE_URL:-https://api.nytimes.com/svc/search/v2}
    ports:
      - "8080:80"
    restart: unless-stopped
